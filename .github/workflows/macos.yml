name: MacOS
on: 
  workflow_dispatch:
  push:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
jobs:
  build:
    name: Build
    # macos-13 (Intel) runners are no longer supported by GitHub Actions.
    # Use macos-14 (Apple Silicon) for all builds:
    # - Qt6: native arm64 build on macos-14
    # - Qt5: x86_64 build via Rosetta 2 on macos-14 (clang_64 Qt tools run under Rosetta)
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        qt-ver: [5.15.2, 6.5.3]        
        # 配置qt-ver的额外设置qt-arch-install，build-arch
        include:
          - qt-ver: 5.15.2
            qt-arch-install: clang_64
            build-arch: x64
            runs-on: macos-14
          - qt-ver: 6.5.3
            qt-arch-install: arm64
            build-arch: arm64
            runs-on: macos-14
    env:
      target-name: QtScrcpy
      qt-install-path: ${{ github.workspace }}/${{ matrix.qt-ver }}
      plantform-des: mac
    steps:
      # 1. 优先检出代码（升级至 v4），确保完整 tag 和子模块被正确拉取
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      # 2. 缓存 Qt
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}
          key: ${{ runner.os }}/${{ matrix.qt-ver }}/${{ matrix.qt-arch-install }}

      # 3. 安装 Qt5
      - name: Install Qt5
        if: startsWith(matrix.qt-ver, '5.')
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 4. 安装 Qt6        
      - name: Install Qt6        
        if: startsWith(matrix.qt-ver, '6.')
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          modules: qtmultimedia
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 5. 编译步骤
      - name: Build MacOS
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          # 显式告诉 cmake 去哪里找当前矩阵对应的 Qt cmake 配置文件
          CMAKE_PREFIX_PATH: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}/lib/cmake
        run: |
          python ci/generate-version.py
          
          # 当检测到 Qt6 构建环境时，利用 sed 动态打补丁
          if [ "${{ matrix.qt-ver }}" = "6.5.3" ]; then
            echo "==== 检测到当前为 Qt6 构建环境，
