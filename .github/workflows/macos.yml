name: MacOS
on: 
  workflow_dispatch:
  push:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
jobs:
  build:
    name: Build
    # macos-13 (Intel) runners are no longer supported by GitHub Actions.
    # Use macos-14 (Apple Silicon) for all builds:
    # - Qt6: native arm64 build on macos-14
    # - Qt5: x86_64 build via Rosetta 2 on macos-14 (clang_64 Qt tools run under Rosetta)
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        qt-ver: [5.15.2, 6.5.3]        
        # 配置qt-ver的额外设置qt-arch-install，build-arch
        include:
          - qt-ver: 5.15.2
            qt-arch-install: clang_64
            build-arch: x64
            runs-on: macos-14
          - qt-ver: 6.5.3
            qt-arch-install: arm64
            build-arch: arm64
            runs-on: macos-14
    env:
      target-name: QtScrcpy
      qt-install-path: ${{ github.workspace }}/${{ matrix.qt-ver }}
      plantform-des: mac
    steps:
      # 1. 优先检出代码（升级至 v4），确保完整 tag 和子模块被正确拉取
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      # 2. 缓存 Qt
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}
          key: ${{ runner.os }}/${{ matrix.qt-ver }}/${{ matrix.qt-arch-install }}

      # 3. 安装 Qt5
      - name: Install Qt5
        if: startsWith(matrix.qt-ver, '5.')
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 4. 安装 Qt6        
      - name: Install Qt6        
        if: startsWith(matrix.qt-ver, '6.')
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          modules: qtmultimedia
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 5. 编译步骤（核心拦截点）
      - name: Build MacOS
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          # 显式告诉 cmake 去哪里找当前矩阵对应的 Qt cmake 配置文件
          CMAKE_PREFIX_PATH: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}/lib/cmake
        run: |
          python ci/generate-version.py
          
          # 【终极核心修复】：拦截并强行改写 CMakeLists.txt 里的硬编码
          if [ "${{ matrix.qt-ver }}" = "6.5.3" ]; then
            echo "==== 检测到当前为 Qt6 构建环境，利用 sed 强行修正 CMakeLists.txt 的硬编码 ===="
            sed -i '' 's/set(QT_DESIRED_VERSION 5)/set(QT_DESIRED_VERSION 6)/g' QtScrcpy/CMakeLists.txt
          fi
          
          # 注入环境变量，双保险防范内部构建脚本拦截
          export QT_DESIRED_VERSION=${{ startsWith(matrix.qt-ver, '6.') && '6' || '5' }}
          
          # 执行编译
          ci/mac/build_for_mac.sh RelWithDebInfo ${{ matrix.build-arch }}

      # 6. 获取ref最后一个/后的内容
      - name: Get the version
        shell: bash
        id: get-version
        # 修复旧语法：废弃了 ::set-output，改用 $GITHUB_OUTPUT
        run: |
          VERSION=${GITHUB_REF##*/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 7. 打包
      - name: Package
        id: package
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          publish_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.build-arch }}-Qt${{ matrix.qt-ver }}-${{ steps.get-version.outputs.version }}
        run: |
          ci/mac/publish_for_mac.sh ../build ${{ matrix.build-arch }}
          ci/mac/package_for_mac.sh
          mv ci/build/QtScrcpy.app ci/build/${{ env.publish_name }}.app
          mv ci/build/QtScrcpy.dmg ci/build/${{ env.publish_name }}.dmg
          # 修复旧语法：改为 $GITHUB_OUTPUT 传递参数给后续步骤
          echo "package-name=${{ env.publish_name }}" >> $GITHUB_OUTPUT

      # 8. 上传 Artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package-name }}.zip
          path: ci/build/${{ steps.package.outputs.package-name }}.dmg

      # 9. 自动发布到 Release
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        # 升级到 v2，防止 Node.js 12/16 停用警告引发的流水线崩溃
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci/build/${{ steps.package.outputs.package-name }}.dmg
          asset_name: ${{ steps.package.outputs.package-name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true
