name: MacOS
on: 
  workflow_dispatch:
  push:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/macos.yml'
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        # 只保留最稳定的 Qt5 构建
        qt-ver: [5.15.2]        
        include:
          - qt-ver: 5.15.2
            qt-arch-install: clang_64
            build-arch: x64
            runs-on: macos-14
    env:
      target-name: QtScrcpy
      qt-install-path: ${{ github.workspace }}/${{ matrix.qt-ver }}
      plantform-des: mac
    steps:
      # 1. 检出源码（升级至 v4）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      # 2. 缓存管理
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}
          key: ${{ runner.os }}/${{ matrix.qt-ver }}/${{ matrix.qt-arch-install }}

      # 3. 安装 Qt5 环境
      - name: Install Qt5
        if: startsWith(matrix.qt-ver, '5.')
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 4. 执行编译
      - name: Build MacOS
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          CMAKE_PREFIX_PATH: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}/lib/cmake
        run: |
          python ci/generate-version.py
          ci/mac/build_for_mac.sh RelWithDebInfo ${{ matrix.build-arch }}

      # 5. 获取语义化的 Git 分支/标签版本
      - name: Get the version
        shell: bash
        id: get-version
        run: |
          VERSION=${GITHUB_REF##*/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 6. 打包阶段（自动修复动态库缺失、依赖注入）
      - name: Package
        id: package
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          publish_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.build-arch }}-Qt${{ matrix.qt-ver }}-${{ steps.get-version.outputs.version }}
        run: |
          # 运行原本的发布脚本（在 ci/build 目录下生成初始的 QtScrcpy.app）
          ci/mac/publish_for_mac.sh ../build ${{ matrix.build-arch }}
          
          # 【核心修复】：注入 macdeployqt 工具，将所有需要的 Qt Frameworks (包括 QtMultimedia) 复制进 App 内部
          echo "==== 开始使用 macdeployqt 修复并注入依赖框架 ===="
          MACDEPLOYQT_BIN="${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}/bin/macdeployqt"
          
          # 动态嗅探 .app 所在位置并执行依赖固化操作
          if [ -d "ci/build/QtScrcpy.app" ]; then
            "$MACDEPLOYQT_BIN" ci/build/QtScrcpy.app -verbose=2
          elif
